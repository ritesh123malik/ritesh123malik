name: GitHub Profile 3D

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Debug Username
        run: echo "USERNAME=ritesh123malik"

      - name: Generate 3D Graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          USERNAME: ritesh123malik
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
